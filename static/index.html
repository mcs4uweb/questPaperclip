<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quest Paperclip</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #121a2b;
      --line: #243049;
      --text: #e8eefc;
      --muted: #93a0bb;
      --accent: #6d7cff;
      --ok: #34d399;
      --warn: #fbbf24;
      --bad: #fb7185;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Segoe UI, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: #0e1628;
    }
    h1 { margin: 0; font-size: 20px; letter-spacing: .04em; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .metrics { display: flex; gap: 18px; font-size: 13px; }
    .metrics b { color: white; }
    nav { display: flex; gap: 8px; padding: 12px 24px; }
    nav button, button, select, input, textarea {
      font: inherit;
      color: var(--text);
      background: #182238;
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    nav button { padding: 8px 12px; cursor: pointer; }
    nav button.active { background: var(--accent); border-color: var(--accent); }
    main { padding: 0 24px 32px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
    .card, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
    }
    .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .muted { color: var(--muted); font-size: 12px; }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
    }
    .running { color: var(--ok); }
    .paused, .idle { color: var(--warn); }
    .exceeded { color: var(--bad); }
    .bar { height: 8px; background: #0b1220; border-radius: 99px; overflow: hidden; margin-top: 8px; }
    .bar > div { height: 100%; background: var(--accent); }
    .bar.hot > div { background: var(--bad); }
    .kanban { display: grid; grid-template-columns: repeat(5, minmax(170px, 1fr)); gap: 10px; overflow-x: auto; }
    .col { min-height: 420px; }
    .ticket { background: #0f1730; border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .actions { display: flex; gap: 6px; }
    button.small { padding: 6px 8px; cursor: pointer; font-size: 12px; }
    form { display: grid; gap: 8px; }
    input, select, textarea { padding: 8px 10px; width: 100%; }
    .hidden { display: none; }
    .toast {
      position: fixed; right: 16px; bottom: 16px;
      background: #064e3b; border: 1px solid #34d399; padding: 10px 14px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>QUEST PAPERCLIP</h1>
      <div class="sub" id="goal">Local agent control plane</div>
    </div>
    <div class="metrics" id="metrics"></div>
  </header>
  <nav>
    <button class="active" data-tab="agents">Agents</button>
    <button data-tab="tasks">Task board</button>
    <button data-tab="budget">Budgets</button>
    <button data-tab="traces">Traces</button>
  </nav>
  <main>
    <section id="agents"></section>
    <section id="tasks" class="hidden"></section>
    <section id="budget" class="hidden"></section>
    <section id="traces" class="hidden"></section>
  </main>
  <div id="toast" class="toast hidden"></div>
  <script>
    const tabs = document.querySelectorAll("nav button");
    const sections = {
      agents: document.getElementById("agents"),
      tasks: document.getElementById("tasks"),
      budget: document.getElementById("budget"),
      traces: document.getElementById("traces"),
    };
    tabs.forEach(btn => btn.onclick = () => {
      tabs.forEach(b => b.classList.toggle("active", b === btn));
      Object.entries(sections).forEach(([k, el]) => el.classList.toggle("hidden", k !== btn.dataset.tab));
    });

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.remove("hidden");
      setTimeout(() => el.classList.add("hidden"), 2500);
    }

    async function api(path, opts) {
      const res = await fetch(path, {
        headers: { "Content-Type": "application/json" },
        ...opts,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || res.statusText);
      return data;
    }

    const columns = ["todo", "in-progress", "done"];
    const nextStatus = {
      todo: "in-progress",
      "in-progress": "done",
      backlog: "todo",
      assigned: "in-progress",
      in_progress: "in-progress",
      review: "done",
      completed: null,
    };
    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }
    function boardStatus(status) {
      if (status === "done" || status === "completed") return "done";
      if (status === "in-progress" || status === "in_progress" || status === "assigned" || status === "review") return "in-progress";
      return "todo";
    }

    async function load() {
      const [company, agents, tickets, traces] = await Promise.all([
        api("/api/company"),
        api("/api/agents"),
        api("/api/tickets"),
        api("/api/traces?limit=40"),
      ]);
      document.getElementById("goal").textContent = company.goal;
      document.getElementById("metrics").innerHTML = `
        <div>Spend <b>$${company.daily_spend.toFixed(2)}</b> / $${company.daily_cap.toFixed(2)}</div>
        <div>Active <b>${company.active_agents}</b></div>
        <div>Open tickets <b>${company.open_tickets}</b></div>
      `;

      sections.agents.innerHTML = `
        <div class="panel" style="margin-bottom:14px">
          <form onsubmit="return createAgent(event)">
            <div class="row">
              <input name="name" placeholder="Agent name" required />
              <input name="role" placeholder="Role (what they monitor / do)" required />
            </div>
            <div class="row" style="margin-top:8px">
              <input name="provider" placeholder="Provider (local, web, Bedrock…)" />
              <input name="model" placeholder="Model" />
              <input name="daily_cap" type="number" step="0.5" min="0" value="5" style="width:110px" title="Daily cap $" />
              <select name="reports_to">
                <option value="">Reports to: none</option>
                ${agents.map(a => `<option value="${a.id}">${a.name}</option>`).join("")}
              </select>
              <button class="small">Add agent</button>
            </div>
          </form>
        </div>
        <div class="grid">${agents.map(a => {
        const pct = a.daily_cap ? Math.min(100, (a.daily_spend / a.daily_cap) * 100) : 0;
        return `<article class="card">
          <div class="row">
            <div><strong>${a.name}</strong><div class="muted">${a.role}</div></div>
            <span class="badge ${a.status}">${a.status}</span>
          </div>
          <p class="muted">${a.provider} · ${a.model}</p>
          <div class="row muted"><span>Daily budget</span><span>$${a.daily_spend.toFixed(2)} / $${a.daily_cap.toFixed(2)}</span></div>
          <div class="bar ${pct >= 100 ? "hot" : ""}"><div style="width:${pct}%"></div></div>
          <div class="actions" style="margin-top:12px">
            <button class="small" onclick="heartbeat('${a.id}')">Heartbeat</button>
            <button class="small" onclick="setStatus('${a.id}','${a.status === "paused" ? "running" : "paused"}')">${a.status === "paused" ? "Resume" : "Pause"}</button>
          </div>
        </article>`;
      }).join("")}</div>`;

      sections.tasks.innerHTML = `
        <div class="panel" style="margin-bottom:14px">
          <form onsubmit="return createTicket(event)">
            <div class="row">
              <input name="story_id" placeholder="US-x.y (optional)" style="max-width:140px" />
              <input name="title" placeholder="Story title" required />
              <select name="assignee_id">${agents.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join("")}</select>
              <select name="priority"><option>P0</option><option selected>P1</option><option>P2</option><option>P3</option></select>
              <input name="sprint" placeholder="Sprint" style="max-width:90px" />
            </div>
            <input name="epic" placeholder="Epic (e.g. Epic 8 — W-2 upload and extraction)" />
            <div class="row">
              <input name="as_a" placeholder="As a …" />
              <input name="i_want" placeholder="I want …" />
              <input name="so_that" placeholder="So that …" />
            </div>
            <textarea name="must_not" rows="2" placeholder="Must not"></textarea>
            <textarea name="blocked_by" rows="2" placeholder="Blocked by (wikilinks or story ids)"></textarea>
            <div class="row">
              <textarea name="files_existing" rows="2" placeholder="Files — existing"></textarea>
              <textarea name="files_create" rows="2" placeholder="Files — create"></textarea>
            </div>
            <textarea name="acceptance" rows="3" placeholder="Acceptance (one checkbox item per line)"></textarea>
            <textarea name="test_plan" rows="2" placeholder="Test"></textarea>
            <div class="row">
              <input name="pr_size" value="one concern" />
              <input name="tags" value="user-story" placeholder="tags (comma-separated)" />
              <button class="small">Add user story</button>
            </div>
          </form>
        </div>
        <div class="kanban">${columns.map(col => `
          <div class="panel col">
            <div class="row"><strong>${col}</strong><span class="muted">${tickets.filter(t => boardStatus(t.status) === col).length}</span></div>
            ${tickets.filter(t => boardStatus(t.status) === col).map(t => {
              const agent = agents.find(a => a.id === t.assignee_id);
              const next = nextStatus[t.status] || nextStatus[boardStatus(t.status)];
              const want = t.i_want || t.description || "";
              return `<div class="ticket">
                <div class="muted">${esc(t.story_id || t.id)} · ${esc(t.priority)}${t.sprint ? " · s" + esc(t.sprint) : ""}</div>
                <strong>${esc(t.title)}</strong>
                <p class="muted">${t.as_a ? `As a ${esc(t.as_a)}` : ""}</p>
                <p class="muted">${esc(want)}</p>
                <p class="muted">${t.epic ? esc(t.epic) : ""}</p>
                ${t.must_not ? `<p class="muted">Must not: ${esc(t.must_not)}</p>` : ""}
                ${t.blocked_by ? `<p class="muted">Blocked by: ${esc(t.blocked_by)}</p>` : ""}
                <div class="row muted"><span>${esc(agent ? agent.name : t.assignee_id)}</span>
                  ${next ? `<button class="small" onclick="advance('${t.id}','${next}')">Advance</button>` : ""}
                </div>
              </div>`;
            }).join("")}
          </div>`).join("")}
        </div>`;

      sections.budget.innerHTML = `<div class="panel"><table>
        <tr><th>Agent</th><th>Spend</th><th>Cap</th><th></th></tr>
        ${agents.map(a => `<tr>
          <td>${a.name}</td>
          <td>$${a.daily_spend.toFixed(2)}</td>
          <td><input type="number" step="0.5" value="${a.daily_cap}" id="cap-${a.id}" style="width:90px"></td>
          <td><button class="small" onclick="saveCap('${a.id}')">Save</button></td>
        </tr>`).join("")}
      </table></div>`;

      sections.traces.innerHTML = `<div class="panel"><table>
        <tr><th>Time</th><th>Agent</th><th>Tool</th><th>Prompt</th><th>Status</th></tr>
        ${traces.map(t => `<tr>
          <td class="muted">${new Date(t.timestamp).toLocaleTimeString()}</td>
          <td>${t.agent_name}</td>
          <td>${t.tool_called}</td>
          <td>${t.prompt}</td>
          <td class="${t.status.includes("Blocked") ? "exceeded" : "running"}">${t.status}</td>
        </tr>`).join("") || "<tr><td colspan=5 class='muted'>No traces yet. Ping an agent heartbeat.</td></tr>"}
      </table></div>`;
    }

    async function heartbeat(id) {
      try {
        const result = await api(`/api/agents/${id}/heartbeat`, {
          method: "POST",
          body: JSON.stringify({ ping_only: true, note: "manual dashboard ping" }),
        });
        toast(`${id}: ${result.action}`);
        await load();
      } catch (err) { toast(err.message); await load(); }
    }
    async function setStatus(id, status) {
      await api(`/api/agents/${id}/status`, { method: "PATCH", body: JSON.stringify({ status }) });
      await load();
    }
    async function saveCap(id) {
      const daily_cap = Number(document.getElementById(`cap-${id}`).value);
      await api(`/api/agents/${id}/budget`, { method: "PATCH", body: JSON.stringify({ daily_cap }) });
      toast("Budget saved");
      await load();
    }
    async function advance(id, status) {
      await api(`/api/tickets/${id}/status`, { method: "PUT", body: JSON.stringify({ status }) });
      await load();
    }
    async function createAgent(event) {
      event.preventDefault();
      const form = new FormData(event.target);
      const reports_to = form.get("reports_to") || null;
      try {
        const agent = await api("/api/agents", {
          method: "POST",
          body: JSON.stringify({
            name: form.get("name"),
            role: form.get("role"),
            provider: form.get("provider") || "local",
            model: form.get("model") || "unassigned",
            daily_cap: Number(form.get("daily_cap") || 5),
            reports_to,
            status: "idle",
          }),
        });
        event.target.reset();
        toast(`Added ${agent.name}`);
        await load();
      } catch (err) { toast(err.message); }
      return false;
    }
    async function createTicket(event) {
      event.preventDefault();
      const form = new FormData(event.target);
      const as_a = form.get("as_a") || "";
      const i_want = form.get("i_want") || "";
      const so_that = form.get("so_that") || "";
      const description = [as_a && `As a ${as_a}`, i_want && `I want ${i_want}`, so_that && `So that ${so_that}`]
        .filter(Boolean).join(". ");
      try {
        await api("/api/tickets", {
          method: "POST",
          body: JSON.stringify({
            title: form.get("title"),
            description,
            assignee_id: form.get("assignee_id"),
            priority: form.get("priority"),
            status: "todo",
            story_id: form.get("story_id") || null,
            epic: form.get("epic") || "",
            sprint: form.get("sprint") || "",
            as_a,
            i_want,
            so_that,
            blocked_by: form.get("blocked_by") || "",
            must_not: form.get("must_not") || "",
            files_existing: form.get("files_existing") || "",
            files_create: form.get("files_create") || "",
            acceptance: form.get("acceptance") || "",
            test_plan: form.get("test_plan") || "",
            pr_size: form.get("pr_size") || "one concern",
            tags: form.get("tags") || "user-story",
          }),
        });
        event.target.reset();
        toast("User story added");
        await load();
      } catch (err) { toast(err.message); }
      return false;
    }

    load().catch(err => toast(err.message));
  </script>
</body>
</html>
